<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple To-Do App</title>
  <style>
    
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      
      display: flex;
      flex-direction: column; 
      align-items: center;    
    }

    h2 {
      color: white;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    .input-container {
      display: flex;
      gap: 10px; /* Space between input and button */
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 250px;
      border: 2px solid #fff;
      border-radius: 6px;
      outline: none;
    }

    button {
      padding: 10px 15px;
      background: #4b3a8a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #362963;
    }

    ul {
      list-style: none;
      padding: 0;
      width: 100%;
      max-width: 330px; /* Keeps the list from stretching too wide */
    }

    li {
      background: rgba(255, 255, 255, 0.9);
      margin: 8px 0;
      padding: 10px;
      display: flex;
      justify-content: space-between; /* Pushes delete button to the right */
      align-items: center;
      border-radius: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .delete-btn {
      background: #ff4d4d;
      padding: 5px 10px;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>

  <h2>To-Do List</h2>

  <div class="input-container">
    <input id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="taskList"></ul>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const taskText = input.value.trim(); // .trim() prevents adding empty spaces

      if (taskText === "") return;

      const li = document.createElement("li");
      
      // Using a class for the delete button to style it separately
      li.innerHTML = `
        <span>${taskText}</span>
        <button class="delete-btn" onclick="this.parentElement.remove()">Delete</button>
      `;

      document.getElementById("taskList").appendChild(li);
      
      input.value = "";
    }

    document.getElementById("taskInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        addTask();
      }
    });
  </script>

</body>
</html>
